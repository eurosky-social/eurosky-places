<style>
/* Layout: a framed city map beside a reading panel; on phones the panel follows the map. */
:root {
  --bg: #e9edf0;
  --land: #f8f9fa;
  --outside: #dde3e7;
  --water: #c7d8e5;
  --border-line: #b9c3cb;
  --district-line: #ccd4da;
  --ink: #1b2228;
  --muted: #5a6670;
  --panel: #ffffff;
  --line: #dfe4e8;
  --signal: #f0d722;
  --signal-ink: #1b2228;
  --chain: #8d99a3;
  --link: #1d4f91;
  --ok: #1f7a4d;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1316; --land: #1a2026; --outside: #13181c; --water: #26465e; --border-line: #3b4650;
    --district-line: #2b333a; --ink: #e6eaed; --muted: #95a1ab; --panel: #161b20; --line: #273038;
    --signal: #f0d722; --signal-ink: #15191d; --chain: #66727c; --link: #8db7ea; --ok: #5cc28f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1316; --land: #1a2026; --outside: #13181c; --water: #26465e; --border-line: #3b4650;
  --district-line: #2b333a; --ink: #e6eaed; --muted: #95a1ab; --panel: #161b20; --line: #273038;
  --signal: #f0d722; --signal-ink: #15191d; --chain: #66727c; --link: #8db7ea; --ok: #5cc28f;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body);
  box-sizing: border-box; margin: 0;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 410px); gap: 16px;
}
*, *::before, *::after { box-sizing: border-box; }
a { color: var(--link); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

#map { border-radius: 10px; border: 1px solid var(--line); background: var(--outside); min-height: 0; }
.leaflet-container { font: 12px/1.3 var(--body); background: var(--outside); }
.leaflet-control-attribution { background: color-mix(in srgb, var(--panel) 85%, transparent) !important; color: var(--muted) !important; }
.leaflet-control-attribution a { color: var(--muted) !important; }
.leaflet-bar a { background: var(--panel) !important; color: var(--ink) !important; border-color: var(--line) !important; }
.city { fill: var(--land); fill-opacity: 1; stroke: var(--border-line); stroke-width: 1.4; }
.district { fill: none; stroke: var(--district-line); stroke-width: 1; }
.water { fill: var(--water); fill-opacity: 1; stroke: none; }
.district-label { color: var(--muted); font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; pointer-events: none; text-align: center; opacity: .8; }
.pin { fill: var(--signal); fill-opacity: 1; stroke: var(--signal-ink); stroke-width: 1.2; cursor: pointer; }
.pin--chain { fill: var(--chain); stroke: var(--panel); stroke-width: 1; }
.pin--dim { fill-opacity: .18; stroke-opacity: .25; }
.pin--hidden { display: none; }
.selected-pin { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--signal); background: var(--panel) center/cover no-repeat; box-shadow: 0 2px 8px rgb(0 0 0 / .3); display: grid; place-items: center; font: 700 15px/1 var(--display); color: var(--ink); }

#panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.panel-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.eyebrow { font: 500 12px/1 var(--mono); color: var(--muted); letter-spacing: .02em; }
h1 { margin: 0; font: 700 34px/1 var(--display); letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
h1 .mark { display: inline-block; background: var(--signal); color: var(--signal-ink); padding: 0 .18em; margin-right: .06em; }
.lede { margin: 0; color: var(--muted); max-width: 46ch; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 500 13px/1.3 var(--body); font-variant-numeric: tabular-nums; }
.stats b { font: 700 18px/1 var(--display); margin-right: 3px; }
.controls { display: grid; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 13px/1 var(--body); padding: 7px 11px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
#search { width: 100%; font: 15px var(--body); padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
#list { list-style: none; margin: 0; padding: 6px 0 12px; }
#list li button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 20px; cursor: pointer; }
#list li button:hover, #list li button:focus-visible { background: var(--bg); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--line) center/cover no-repeat; display: grid; place-items: center; font: 700 15px/1 var(--display); color: var(--muted); flex: none; }
.row-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-count { font: 700 16px/1 var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { padding: 16px 20px; color: var(--muted); }

#detail { display: grid; gap: 18px; padding: 14px 20px 24px; }
.back { all: unset; cursor: pointer; color: var(--link); font-weight: 500; justify-self: start; padding: 4px 0; }
.place-name { margin: 0; font: 700 28px/1.05 var(--display); text-wrap: balance; }
.place-meta { color: var(--muted); margin-top: 4px; }
.status { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 600 12px/1 var(--body); padding: 6px 9px; border-radius: 6px; border: 1px solid var(--line); }
.tag--ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.why { margin: 0; color: var(--muted); font-size: 14px; }
.section-label { font: 600 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.account { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: start; }
.account .avatar { width: 52px; height: 52px; font-size: 20px; }
.account-name { font-weight: 600; font-size: 17px; }
.account-handle { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.account-bio { margin: 6px 0 0; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.posts { display: grid; gap: 10px; }
.post { border-left: 3px solid var(--signal); padding: 2px 0 2px 12px; display: grid; gap: 6px; }
.post-text { white-space: pre-line; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.post-meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-variant-numeric: tabular-nums; }
.source-note { font-size: 12px; color: var(--muted); }
.record { display: grid; gap: 4px; font: 12px/1.5 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.claim { border: 1px dashed var(--border-line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.claim p { margin: 0; }
.claim button { justify-self: start; font: 600 14px var(--body); padding: 9px 14px; border-radius: 8px; border: 0; background: var(--signal); color: var(--signal-ink); cursor: pointer; }
.claim-note { color: var(--muted); font-size: 14px; }
.also { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.also button { all: unset; cursor: pointer; display: block; padding: 5px 0; color: var(--link); }
.also .here { color: var(--ink); font-weight: 600; cursor: default; }

@media (max-width: 760px) {
  html, body { height: auto; }
  body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 52vh auto; }
  #panel { overflow: visible; }
  h1 { font-size: 30px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<body>
<div id="map" role="region" aria-label="Map of Berlin with verified places"></div>
<aside id="panel" aria-label="Places">
  <header class="panel-head">
    <div class="eyebrow">places.eurosky.tech · demo · Berlin</div>
    <h1><span class="mark">Berlin</span> storefronts</h1>
    <p class="lede">Places whose own website domain is also the handle of their account. We verified the link automatically; the businesses have not claimed their place yet.</p>
    <div class="stats" id="stats"></div>
  </header>
  <div id="browse">
    <div class="controls">
      <div class="chips" role="group" aria-label="Show">
        <button class="chip" id="f-all" aria-pressed="true" data-filter="all">All</button>
        <button class="chip" id="f-org" aria-pressed="false" data-filter="org">Organisations and venues</button>
        <button class="chip" id="f-chain" aria-pressed="false" data-filter="chain">Chains</button>
      </div>
      <input id="search" type="search" placeholder="Search a place or account" autocomplete="off" aria-label="Search a place or account">
    </div>
    <ul id="list"></ul>
  </div>
  <section id="detail" hidden></section>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const EMBEDDED = null;
// Live profiles and posts where the page may call Eurosky's public API: opened as a file, or
// served from our own site (or localhost while working on it). Elsewhere (a sandboxed
// preview) it shows the data it carries.
const LIVE = location.protocol === "file:" || location.hostname === "localhost" || /(^|\.)eurosky\.tech$/.test(location.hostname);
const APPVIEW = "https://api.eurosky.network/xrpc/";
const PLACES_API = "https://places.eurosky.tech/xrpc/org.atgeo.getPlace?uri=";

// The page either carries its data or finds it next to itself.
if (EMBEDDED) boot(EMBEDDED);
else fetch("data.json").then((r) => (r.ok ? r.json() : Promise.reject(r.status))).then(boot).catch(() => {
  const li = document.createElement("li");
  li.className = "empty";
  li.textContent = "The map data could not be loaded. Reload the page to try again.";
  document.getElementById("list").replaceChildren(li);
});

function boot(DATA) {

const places = DATA.places;
const accounts = DATA.accounts;
const placesOf = accounts.map(() => []);
places.forEach((p, i) => placesOf[p.a].push(i));
let filter = "all";
let query = "";
let selected = null;

const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmt = new Intl.NumberFormat("en");
const dateFmt = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric" });
const SOURCES = { ov: ["overturemaps.org", "Overture Maps"], fsq: ["foursquare.com", "Foursquare"], osm: ["openstreetmap.org", "OpenStreetMap"] };
// OpenStreetMap IDs come as n123 / w123 / r123: a node, way or relation.
const OSM_TYPES = { n: "node", w: "way", r: "relation" };
const urn = (p) => p.s === "osm"
  ? `urn:atgeo:openstreetmap.org:${OSM_TYPES[p.i[0]]}:${p.i.slice(1)}`
  : `urn:atgeo:${SOURCES[p.s][0]}:place:${p.i}`;
const shortName = (a) => a.n || a.h;

function avatarEl(a, cls = "avatar") {
  const e = el("div", cls);
  if (a.av) e.style.backgroundImage = `url("${a.av}")`;
  else e.textContent = shortName(a).replace(/[^\p{L}\p{N}]/gu, "").slice(0, 1).toUpperCase();
  e.setAttribute("aria-hidden", "true");
  return e;
}

// ---- map -------------------------------------------------------------------
const map = L.map("map", { zoomSnap: 0.25, minZoom: 9.5, maxZoom: 18, attributionControl: true, zoomControl: true });
map.attributionControl.setPrefix(false);
map.attributionControl.addAttribution('Map data © <a href="https://overturemaps.org" target="_blank" rel="noopener">Overture Maps Foundation</a>, © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>, <a href="https://opensource.foursquare.com/os-places/" target="_blank" rel="noopener">Foursquare</a>');
// Land and water in their own pane below the district names; pins stay on top of both.
map.createPane("base").style.zIndex = 300;
map.createPane("names").style.zIndex = 350;
const baseRenderer = L.svg({ pane: "base" });
const city = L.geoJSON(DATA.map.outline, { className: "city", interactive: false, renderer: baseRenderer, pane: "base" }).addTo(map);
L.geoJSON({ type: "FeatureCollection", features: DATA.map.water }, { className: "water", interactive: false, renderer: baseRenderer, pane: "base" }).addTo(map);
L.geoJSON({ type: "FeatureCollection", features: DATA.map.districts }, { className: "district", interactive: false, renderer: baseRenderer, pane: "base" }).addTo(map);
const labels = L.layerGroup(DATA.map.districts.map((d) => L.marker([d.label[1], d.label[0]], {
  interactive: false, keyboard: false, pane: "names",
  icon: L.divIcon({ className: "district-label", html: d.properties.name.replace("-", "-<br>"), iconSize: [140, 26], iconAnchor: [70, 13] }),
}))).addTo(map);
const cityBounds = city.getBounds();
map.fitBounds(cityBounds, { padding: [12, 12] });
map.setMaxBounds(cityBounds.pad(0.35));

const pins = places.map((p, i) => {
  const chain = accounts[p.a].k === "chain";
  const m = L.circleMarker([p.y, p.x], { radius: chain ? 3.5 : 6, className: chain ? "pin pin--chain" : "pin", bubblingMouseEvents: false });
  m.bindTooltip(`${p.n}`, { direction: "top", offset: [0, -6] });
  m.on("click", () => select(i, { fly: false }));
  return m.addTo(map);
});
// Venues above chain outlets.
pins.forEach((m, i) => { if (accounts[places[i].a].k !== "chain") m.bringToFront(); });
let selectedMarker = null;

function setPinClass(i, cls, on) {
  const path = pins[i].getElement();
  if (path) path.classList.toggle(cls, on);
}

// ---- browse ----------------------------------------------------------------
function visibleAccount(a) {
  if (filter !== "all" && a.k !== filter) return false;
  if (!query) return true;
  const hay = [a.n, a.h, ...placesOf[accounts.indexOf(a)].map((i) => places[i].n)].join(" ").toLowerCase();
  return hay.includes(query);
}

function renderStats() {
  const s = $("#stats");
  s.replaceChildren();
  const add = (n, label) => { const span = el("span"); span.append(el("b", null, fmt.format(n)), label); s.append(span); };
  add(places.length, "places");
  add(accounts.length, "accounts");
  add(new Set(places.map((p) => p.d)).size, "districts");
}

function renderList() {
  const list = $("#list");
  list.replaceChildren();
  const shown = accounts.filter(visibleAccount);
  shown.forEach((a) => {
    const ai = accounts.indexOf(a);
    const own = placesOf[ai];
    const li = el("li");
    const b = el("button");
    b.type = "button";
    const text = el("div");
    text.style.minWidth = "0";
    text.append(el("div", "row-name", shortName(a)));
    const districts = [...new Set(own.map((i) => places[i].d))];
    const where = districts.length > 2 ? `${districts.length} districts` : districts.join(", ");
    text.append(el("div", "row-sub", `@${a.h} · ${where}`));
    b.append(avatarEl(a), text, el("span", "row-count", own.length > 1 ? String(own.length) : ""));
    b.setAttribute("aria-label", `${shortName(a)}, ${own.length} ${own.length === 1 ? "place" : "places"}`);
    b.addEventListener("click", () => selectAccount(ai));
    li.append(b);
    list.append(li);
  });
  if (!shown.length) list.append(el("li", "empty", "No place or account matches this search."));
  const visible = new Set(shown.map((a) => accounts.indexOf(a)));
  places.forEach((p, i) => setPinClass(i, "pin--hidden", !visible.has(p.a)));
}

document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
  filter = c.dataset.filter;
  document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === c)));
  renderList();
}));
$("#search").addEventListener("input", (e) => { query = e.target.value.trim().toLowerCase(); renderList(); });

// ---- detail ----------------------------------------------------------------
function selectAccount(ai) {
  const own = placesOf[ai];
  if (own.length === 1) return select(own[0], { fly: true });
  const b = L.latLngBounds(own.map((i) => [places[i].y, places[i].x]));
  map.flyToBounds(b, { padding: [40, 40], maxZoom: 15, duration: 0.6 });
  select(own[0], { fly: false });
}

function select(i, { fly }) {
  selected = i;
  const p = places[i];
  const a = accounts[p.a];
  places.forEach((q, j) => setPinClass(j, "pin--dim", q.a !== p.a));
  if (selectedMarker) selectedMarker.remove();
  const icon = L.divIcon({ className: "", html: "", iconSize: [38, 38], iconAnchor: [19, 19] });
  selectedMarker = L.marker([p.y, p.x], { icon, keyboard: false, zIndexOffset: 1000 }).addTo(map);
  const pinEl = selectedMarker.getElement();
  const face = avatarEl(a, "selected-pin");
  face.removeAttribute("aria-hidden");
  pinEl.append(face);
  if (fly) map.flyTo([p.y, p.x], Math.max(map.getZoom(), 15), { duration: 0.6 });
  renderDetail(i);
  $("#browse").hidden = true;
  $("#detail").hidden = false;
  $("#panel").scrollTop = 0;
  if (window.matchMedia("(max-width: 760px)").matches) $("#panel").scrollIntoView({ behavior: "smooth", block: "start" });
}

function closeDetail() {
  selected = null;
  if (selectedMarker) { selectedMarker.remove(); selectedMarker = null; }
  places.forEach((q, j) => setPinClass(j, "pin--dim", false));
  $("#detail").hidden = true;
  $("#browse").hidden = false;
}

function postEl(a, post) {
  const art = el("article", "post");
  art.append(el("div", "post-text", post.t || "(no text)"));
  const meta = el("div", "post-meta");
  if (post.at) meta.append(el("span", null, dateFmt.format(new Date(post.at))));
  const kinds = { images: "Photo", video: "Video", external: "Link", record: "Quote", recordWithMedia: "Quote" };
  if (kinds[post.e]) meta.append(el("span", null, kinds[post.e]));
  meta.append(el("span", null, `${fmt.format(post.l)} likes · ${fmt.format(post.rp)} reposts · ${fmt.format(post.r)} replies`));
  const link = el("a", null, "Open post ↗");
  link.href = `https://bsky.app/profile/${a.h}/post/${post.k}`;
  link.target = "_blank"; link.rel = "noopener";
  meta.append(link);
  art.append(meta);
  return art;
}

function renderPosts(box, note, a, posts, live) {
  box.replaceChildren();
  if (!posts.length) box.append(el("div", "empty", "This account has not posted yet."));
  posts.forEach((post) => box.append(postEl(a, post)));
  note.textContent = live ? "Latest posts, live from Eurosky." : `Latest posts as of ${dateFmt.format(new Date(DATA.snapshot))}.`;
}

function loadLive(a, box, note) {
  if (!LIVE) return;
  const url = `${APPVIEW}app.bsky.feed.getAuthorFeed?actor=${encodeURIComponent(a.did)}&filter=posts_no_replies&limit=15`;
  fetch(url).then((r) => (r.ok ? r.json() : Promise.reject(r.status))).then((d) => {
    const posts = d.feed.filter((x) => !x.reason).slice(0, 3).map((x) => ({
      t: x.post.record.text, at: x.post.record.createdAt, l: x.post.likeCount || 0, rp: x.post.repostCount || 0,
      r: x.post.replyCount || 0, e: ((x.post.embed || {}).$type || "").split(".").pop().split("#")[0], k: x.post.uri.split("/").pop(),
    }));
    if (selected != null && accounts[places[selected].a] === a) renderPosts(box, note, a, posts, true);
  }).catch(() => {
    if (a.p.length || selected == null || accounts[places[selected].a] !== a) return;
    box.replaceChildren(el("div", "empty", "The latest posts could not be loaded right now."));
    note.textContent = "";
  });
}

// Names, avatars and follower counts as they are now, 25 accounts per request.
async function refreshProfiles() {
  const byDid = new Map(accounts.map((a) => [a.did, a]));
  for (let i = 0; i < accounts.length; i += 25) {
    const q = accounts.slice(i, i + 25).map((a) => `actors=${encodeURIComponent(a.did)}`).join("&");
    try {
      const r = await fetch(`${APPVIEW}app.bsky.actor.getProfiles?${q}`);
      if (!r.ok) continue;
      for (const p of (await r.json()).profiles) {
        const a = byDid.get(p.did);
        if (!a) continue;
        a.n = (p.displayName || "").trim() || a.n;
        a.f = p.followersCount ?? a.f;
        a.b = p.description ?? a.b ?? "";
        if (p.avatar) a.av = p.avatar.replace("/img/avatar/", "/img/avatar_thumbnail/");
      }
    } catch {
      // The list keeps what the page carried.
    }
  }
  renderList();
}

function renderDetail(i) {
  const p = places[i];
  const a = accounts[p.a];
  const d = $("#detail");
  d.replaceChildren();

  const back = el("button", "back", "← All places");
  back.type = "button";
  back.addEventListener("click", closeDetail);
  d.append(back);

  const head = el("div");
  head.append(el("h2", "place-name", p.n));
  head.append(el("div", "place-meta", [p.c, p.h, p.d].filter(Boolean).filter((v, k, arr) => arr.indexOf(v) === k).join(" · ")));
  d.append(head);

  const status = el("div", "status");
  status.append(el("span", "tag tag--ok", "✓ Verified link"), el("span", "tag", "Not claimed yet"));
  d.append(status);
  d.append(el("p", "why", `The place lists ${a.h} as its website, and ${a.h} is this account's handle. Only whoever controls that domain can set the handle, so the link is verified without the business doing anything.`));

  const acc = el("div");
  acc.append(el("div", "section-label", "Account"));
  const card = el("div", "account");
  const body = el("div");
  body.style.minWidth = "0";
  body.append(el("div", "account-name", shortName(a)));
  const handle = el("div", "account-handle");
  const prof = el("a", null, `@${a.h}`);
  prof.href = `https://bsky.app/profile/${a.h}`; prof.target = "_blank"; prof.rel = "noopener";
  handle.append(prof, ` · ${fmt.format(a.f)} followers`);
  body.append(handle);
  if (a.b) body.append(el("p", "account-bio", a.b));
  card.append(avatarEl(a), body);
  acc.append(card);
  d.append(acc);

  const postsWrap = el("div");
  postsWrap.append(el("div", "section-label", "Latest posts"));
  const box = el("div", "posts");
  const note = el("div", "source-note");
  postsWrap.append(box, note);
  d.append(postsWrap);
  if (a.p.length || !LIVE) renderPosts(box, note, a, a.p, false);
  else box.append(el("div", "empty", "Loading the latest posts…"));
  loadLive(a, box, note);

  const own = placesOf[p.a];
  if (own.length > 1) {
    const also = el("div");
    also.append(el("div", "section-label", `${own.length} places linked to this account`));
    const ul = el("ul", "also");
    own.slice(0, 12).forEach((j) => {
      const li = el("li");
      const label = `${places[j].n}${places[j].h ? ` · ${places[j].h}` : ""}`;
      if (j === i) li.append(el("span", "here", label));
      else {
        const b = el("button", null, label);
        b.type = "button";
        b.addEventListener("click", () => select(j, { fly: true }));
        li.append(b);
      }
      ul.append(li);
    });
    if (own.length > 12) ul.append(el("li", "source-note", `and ${own.length - 12} more on the map`));
    also.append(ul);
    d.append(also);
  }

  const rec = el("div");
  rec.append(el("div", "section-label", "Place record"));
  const r = el("div", "record");
  r.append(el("span", null, `From ${SOURCES[p.s][1]}`), el("span", null, urn(p)), el("span", null, `${p.y.toFixed(5)}, ${p.x.toFixed(5)}`));
  const open = el("a", null, "Open on places.eurosky.tech ↗");
  open.href = PLACES_API + encodeURIComponent(urn(p)); open.target = "_blank"; open.rel = "noopener";
  r.append(open);
  rec.append(r);
  d.append(rec);

  const claim = el("div", "claim");
  claim.append(el("p", null, `Is this ${shortName(a)}? Claim the place to add opening hours, photos and your own description.`));
  const btn = el("button", null, "Claim this place");
  btn.type = "button";
  const cnote = el("p", "claim-note");
  cnote.hidden = true;
  cnote.textContent = "Claiming opens soon. This demo shows the links we could verify on our own.";
  btn.addEventListener("click", () => { cnote.hidden = false; });
  claim.append(btn, cnote);
  d.append(claim);
}

renderStats();
renderList();
window.addEventListener("keydown", (e) => { if (e.key === "Escape" && selected != null) closeDetail(); });
if (LIVE) refreshProfiles();
}
</script>
</body>
</html>
